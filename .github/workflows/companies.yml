name: Companies

# The only workflow that spends money, which is why it is its own — a paid run
# should be a decision, not a side effect of the daily one. The ceiling is
# enforced by Apify itself via `maxTotalChargeUsd` on every run, and the
# month's total is read back out of `apify_run` before each one starts.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many companies to look up"
        required: false
        default: "1000"
      dry_run:
        description: "Print the queue and the price, spend nothing"
        type: boolean
        default: true
      monitor:
        description: >
          Ask Crunchbase only for rounds it has not returned before. Cheap, and
          wrong after a run whose results were lost — the rounds were delivered
          as far as it is concerned, so it would return nothing.
        type: boolean
        default: true
  schedule:
    # Mondays, after the weekly discover run has refreshed the corpus the seed
    # list is built from.
    - cron: "0 6 * * 1"

# Writing the database means replacing the release asset, which the default
# token cannot do. Its absence is what lost the first paid run: every actor
# finished, and the upload at the end returned 403.
permissions:
  contents: write

# The same group as every other workflow that writes the database. They each
# check the file out, change it and publish the whole thing back, so two of
# them running at once does not merge — the second publish simply erases the
# first one's work.
concurrency:
  group: airadar-pipeline
  cancel-in-progress: false

jobs:
  companies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          token: ${{ github.token }}

      # Before any of it is spent. The first paid run finished every actor and
      # then failed to publish, because this job had no write permission — so
      # the money was gone and the data with it. A permission is easy to fix
      # once; "something makes the publish fail after the spending" is the
      # shape of the problem, and the answer is to find out first, for the
      # price of uploading nine bytes.
      - name: Check that the database can actually be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo preflight > preflight.txt
          gh release view data >/dev/null 2>&1 || gh release create data \
            --title "Veri deposu" --notes "AI Radar veritabanı." --latest=false
          gh release upload data preflight.txt --clobber
          gh release delete-asset data preflight.txt --yes
          rm preflight.txt
          echo "publishing works; safe to spend"

      - name: Rebuild the company universe
        run: airadar companies-sync

      # The scheduled run is deliberately not a dry run: a weekly refresh that
      # prints a price and buys nothing is a weekly reminder, not a pipeline.
      - name: Traffic
        run: |
          airadar companies-traffic \
            --limit ${{ inputs.limit || 1000 }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # Rounds need no company list at all — they are selected by type, amount
      # and date — so this is the one paid query that finds companies the
      # corpus has never heard of. `fundingMonitor` means a monthly top-up is
      # charged only for rounds it has not already returned.
      - name: Funding rounds
        run: |
          airadar companies-funding --what rounds --limit 400 \
            ${{ inputs.monitor == false && '--no-monitor' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Funding profiles
        run: |
          airadar companies-funding --what profiles --limit 500 \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # G2 covers a minority of this universe by design and the run is billed
      # per review found, so the companies with no page cost almost nothing.
      - name: G2 ratings
        run: |
          airadar companies-ratings --limit 200 \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - uses: ./.github/actions/publish-db
        if: always()
        with:
          token: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Apify harcaması"
            echo '```'
            sqlite3 -header -column data/airadar.db \
              "SELECT date(started_at) AS gun, actor, items, round(cost_usd, 4) AS usd, status
               FROM apify_run ORDER BY id DESC LIMIT 20;" || true
            sqlite3 data/airadar.db \
              "SELECT 'bu ay toplam: $' || round(COALESCE(sum(cost_usd), 0), 2)
               FROM apify_run WHERE started_at >= date('now', 'start of month');" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Without this the paid data sits in the database and never reaches the site.
  # Every other pipeline workflow ends the same way; this one was the exception
  # because it was written before the company boards existed.
  publish:
    needs: companies
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
