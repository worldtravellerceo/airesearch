name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pipeline:
    name: pipeline (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: pipeline
        run: |
          ruff check airadar tests
          ruff format --check airadar tests
      - name: Test
        working-directory: pipeline
        run: pytest tests -q

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      # Builds against whatever data is checked in — none, in CI. The site must
      # build and say it is empty rather than fail, because that is exactly the
      # state of the very first deploy.
      - name: Build
        working-directory: web
        run: npx next build
