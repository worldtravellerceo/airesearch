name: Discover

on:
  schedule:
    # Sunday 03:20 UTC, well clear of the daily collect window.
    - cron: "20 3 * * 0"
  workflow_dispatch:
    inputs:
      channels:
        description: "topics,keywords,snowball,awesome,ecosystems,huggingface,resolve — or all"
        required: false
        default: all
        type: string
      max_queries:
        description: "Search-request budget for this run"
        required: false
        default: "4000"
        type: string
      resolve_limit:
        description: "Cap how many pending names to look up"
        required: false
        default: "2000"
        type: string

permissions:
  contents: write

concurrency:
  group: airadar-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          token: ${{ github.token }}

      - name: Check credentials
        run: airadar doctor

      # Before discovery, not only after: the snowball channel reads
      # `repo_classification` to find topics that the seed vocabulary never had
      # (the next `mcp`). On the first run that table was empty, so snowball
      # silently returned nothing and the entire Agent Skills ecosystem —
      # `claude-code`, `agent-skills`, `openclaw` — was never swept.
      - name: Classify what is already known
        run: airadar classify --no-llm

      # The search endpoint allows 30 requests a minute, so a full sweep is far
      # longer than one job. The budget stops it cleanly and the next run
      # resumes — swept topics are recorded, so nothing is redone.
      - name: Discover
        run: |
          airadar discover \
            --channels "${{ inputs.channels || 'all' }}" \
            --max-queries "${{ inputs.max_queries || '4000' }}" \
            --resolve-limit "${{ inputs.resolve_limit || '2000' }}"

      - name: Classify
        run: airadar classify --no-llm

      # Replayed every run: the verdicts live in the repository, not only in a
      # database that is a release asset. Repos whose description or topics
      # changed since a verdict was made are skipped, not relabelled.
      - name: Apply reviewed verdicts
        run: airadar classify --import-verdicts verdicts

      - name: Score
        run: airadar score

      - uses: ./.github/actions/publish-db
        if: always()
        with:
          token: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Veri durumu"
            echo '```'
            COLUMNS=140 airadar stats || true
            echo '```'
            echo "### Kapsama kontrolü"
            echo '```'
            COLUMNS=140 airadar coverage || true
            COLUMNS=140 airadar freshness || true
            echo '```'
            echo "### Fresh Power — ilk 20"
            echo '```'
            COLUMNS=140 airadar board fresh --limit 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: discover
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
