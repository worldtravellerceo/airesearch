name: Reclassify

# Re-judges the whole universe without a discovery sweep. Worth its own
# workflow because a change to the rule engine invalidates every cached
# verdict, and waiting for Sunday's discover run — 50 minutes of search
# requests that would find nothing new — is not a reason to leave the boards
# wrong for a week.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airadar-pipeline
  cancel-in-progress: false

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Optional. The primary rate limit is per token, so each extra one
      # raises the ceiling; absent, the run simply uses the single lane.
      GH_PAT_2: ${{ secrets.GH_PAT_2 }}
      GH_PAT_3: ${{ secrets.GH_PAT_3 }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          token: ${{ github.token }}

      - name: Classify
        run: airadar classify --no-llm

      - name: Apply reviewed verdicts
        run: airadar classify --import-verdicts verdicts

      # The same free, replayed path as the verdicts above, and here for the
      # same reason: text committed to the repository otherwise reaches the
      # database only through the daily census, which is 37 minutes of work
      # nobody needs in order to apply a paragraph that is already written.
      # 113 rows sat in git waiting for tomorrow morning before this line
      # existed. No key, no profile, no network — an already-written or
      # stale-hashed row is skipped, so running it twice costs nothing.
      - name: Apply written summaries
        run: airadar summarise --import summaries

      - name: Score
        run: airadar score

      # Token-free and incremental, as in the daily run; here so a re-score
      # does not publish explosion rows whose AI relation was never read.
      - name: Read how the explosion rows relate to AI
        continue-on-error: true
        # continue-on-error does nothing for a step that hangs; this does.
        timeout-minutes: 20
        run: airadar explosion-evidence

      - uses: ./.github/actions/publish-db
        if: always()
        with:
          token: ${{ github.token }}

      # To stdout as well as the summary: the summary block is redirected into
      # $GITHUB_STEP_SUMMARY, so its numbers never reach the job log and cannot
      # be read back from the API afterwards.
      - name: Audit
        if: always()
        run: |
          COLUMNS=140 airadar coverage || true
          COLUMNS=140 airadar freshness || true
          COLUMNS=140 airadar completeness || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Veri durumu"
            echo '```'
            COLUMNS=140 airadar stats || true
            echo '```'
            echo "### Kapsama kontrolü"
            echo '```'
            COLUMNS=140 airadar coverage || true
            COLUMNS=140 airadar freshness || true
            COLUMNS=140 airadar completeness || true
            echo '```'
            echo "### Fresh Power — ilk 20"
            echo '```'
            COLUMNS=140 airadar board fresh --limit 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: reclassify
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
