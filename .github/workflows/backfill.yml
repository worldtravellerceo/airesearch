name: Backfill

# Manual only. A full backfill is roughly nine requests per five-year-old repo
# and is needed once per repository, not on a schedule. It is what puts a repo
# on the Fresh Power board: that metric integrates a project's whole life, and
# one page of history recovers only about 55% of it.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "A single owner/name (blank = everything still missing history)"
        required: false
        type: string
      limit:
        description: "Stop after this many repos"
        required: false
        default: "400"
        type: string
      reset_inflated:
        description: "First clear derived history for repos whose history exceeds their stars"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: airadar-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          token: ${{ github.token }}

      # A repo cannot have gained more stars than it has, so a history total
      # above the star count is corruption. The weekly buckets are one-way, so
      # the repair is to clear and re-fetch.
      - name: Reset inflated history
        if: ${{ inputs.reset_inflated }}
        run: airadar reset-history

      - name: Backfill
        run: |
          if [ -n "${{ inputs.repo }}" ]; then
            airadar backfill --repo "${{ inputs.repo }}"
          else
            airadar backfill --limit "${{ inputs.limit || '400' }}"
          fi

      - name: Score
        run: airadar score

      - uses: ./.github/actions/publish-db
        if: always()
        with:
          token: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Veri durumu"
            echo '```'
            COLUMNS=140 airadar stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: backfill
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
