name: Daily

on:
  schedule:
    # 06:10 UTC. Not on the hour: scheduled runs cluster at :00 and get queued.
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many repos (blank = all that are due)"
        required: false
        type: string

permissions:
  contents: write

# Two collects at once would spend the API quota twice on the same repos.
concurrency:
  group: airadar-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Optional. The primary rate limit is per token, so each extra one
      # raises the ceiling; absent, the run simply uses the single lane.
      GH_PAT_2: ${{ secrets.GH_PAT_2 }}
      GH_PAT_3: ${{ secrets.GH_PAT_3 }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline
        with:
          token: ${{ github.token }}

      - name: Check credentials and the star-history endpoint
        run: airadar doctor

      # The census, every day rather than only on Sunday. It is 785 search
      # requests — about 26 minutes — and it is the only channel that sees a
      # repository which did not exist last week. Leaving it on the weekly
      # discover run meant a project that went viral on Monday stayed invisible
      # until the following Sunday: the whole corpus shared a single
      # `first_seen_at` day, and an index whose subject is fast risers cannot
      # afford to learn about them six days late.
      - name: Census
        run: airadar discover --channels census --max-queries 2000 --resolve-limit 0

      # Below the census floor, and only at repositories young enough to still
      # be climbing towards it. 138 pages of search against the 1,551 that
      # lowering the census floor to 300 stars would cost.
      - name: Nursery
        run: airadar discover --channels nursery --max-queries 400 --resolve-limit 0

      - name: Classify what the census found
        run: airadar classify --no-llm

      - name: Apply reviewed verdicts
        run: airadar classify --import-verdicts verdicts

      # Read what the repos the metadata could not place say about themselves.
      # Bounded per run rather than done in one sweep: there are 53,475 of them
      # and the whole backlog is about three and a half hours of quota, which
      # would crowd out the collection this run exists for. Biggest first, so
      # the slice that does run is the one it would have cost most to miss, and
      # ETags make everything already read free on the next pass.
      - name: Read the READMEs of repos with no signal
        run: airadar readmes --limit 4000

      - name: Classify again, now with the READMEs
        run: airadar classify --no-llm

      - name: Collect
        run: airadar collect ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Score
        run: airadar score

      # Free: it only reads homepages already in the corpus. It runs daily so
      # that a company which shipped its first repository this morning is in
      # the universe before anything paid is asked to look it up.
      - name: Rebuild the company universe
        run: airadar companies-sync

      # Also free, and unmetered: Crunchbase News is WordPress and its REST API
      # is public. It is the only place any source here states a valuation, so
      # it runs daily rather than only with the paid pull it used to sit beside.
      - name: Read the valuations off the press
        run: airadar companies-valuations --limit 400

      # The queue of repositories the engine did not settle. It has existed as
      # a command since the day a zero was found to mean "no signal" rather
      # than "not AI" — and it was never run by anything, so the 6,823
      # unsettled repositories went exactly where the zeroes used to go. A
      # verdict nobody can reach is silence with extra steps.
      - name: Write the review queue
        if: always()
        run: airadar review-queue --out review-queue.json --limit 2000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-queue
          path: review-queue.json
          if-no-files-found: warn
          retention-days: 30

      - uses: ./.github/actions/publish-db
        if: always()
        with:
          token: ${{ github.token }}

      # To stdout as well as the summary: the summary block is redirected into
      # $GITHUB_STEP_SUMMARY, so its numbers never reach the job log and cannot
      # be read back from the API afterwards.
      - name: Audit
        if: always()
        run: |
          COLUMNS=140 airadar coverage || true
          COLUMNS=140 airadar freshness || true
          COLUMNS=140 airadar completeness || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Veri durumu"
            echo '```'
            COLUMNS=140 airadar stats || true
            echo '```'
            echo "### Kapsama kontrolü"
            echo '```'
            COLUMNS=140 airadar coverage || true
            COLUMNS=140 airadar freshness || true
            COLUMNS=140 airadar completeness || true
            echo '```'
            echo "### Fresh Power — ilk 20"
            echo '```'
            COLUMNS=140 airadar board fresh --limit 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: collect
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
